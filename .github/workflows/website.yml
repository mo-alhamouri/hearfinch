# Builds web/ and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   API_URL             e.g. https://hearfinch-api.<your-subdomain>.workers.dev   (empty = demo mode)
#   TURNSTILE_SITE_KEY  Cloudflare Turnstile site key                              (empty = off)
#   GOOGLE_SITE_VERIFICATION  content value of Search Console's HTML tag           (empty = off)
#   CF_ANALYTICS_TOKEN  Cloudflare Web Analytics site token                        (empty = off)
name: Website

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: |
          # Project sites live at /<repo>/; a <user>.github.io repo lives at /.
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=/; else export BASE_PATH="/$REPO/"; fi
          npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          VITE_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
