# Publishes a GitHub release.
#  - Push a tag like v0.2.0, or run it from Actions → Release → Run workflow.
#  - Notes come from releases/<version>.md when that file exists,
#    otherwise GitHub writes them from the commit messages since the last release.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.2.3"; exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."; exit 0
          fi
          NOTES="releases/$VERSION.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "Hearfinch $VERSION" --notes-file "$NOTES"
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "Hearfinch $VERSION" --generate-notes
          fi
