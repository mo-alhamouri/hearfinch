# Adds movies and shows to the dialogue index, from the OpenSubtitles.com API.
# Run it from Actions → Dialogue index → Run workflow. Safe to repeat: titles
# already in the index are skipped, and it stops cleanly at the daily download limit.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TMDB_API_KEY,
#   OPENSUBTITLES_API_KEY, OPENSUBTITLES_USERNAME, OPENSUBTITLES_PASSWORD
#
# Subtitle text is copyrighted. It only ever goes into your Cloudflare database —
# never into this repository or the workflow's artifacts.
name: Dialogue index

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'What to add'
        type: choice
        options: [movie, tv, both]
        default: movie
      list:
        description: 'Which TMDB list'
        type: choice
        options: [popular, top_rated]
        default: popular
      pages:
        description: 'Pages of 20 titles'
        default: '1'
      episodes:
        description: 'Episodes per show'
        default: '3'

concurrency:
  group: dialogue-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
      OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
      OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Find the dialogue database
        run: npm run ci:prepare-d1
      - name: Create or update its tables
        run: npx wrangler d1 migrations apply hearfinch-dialogue --remote
      - name: See what's already indexed
        run: npm run d1:pull
      - name: Download and index subtitles
        run: >
          npm run ci:index:opensubtitles --
          --type "${{ inputs.type }}" --list "${{ inputs.list }}"
          --pages "${{ inputs.pages }}" --episodes "${{ inputs.episodes }}"
      - name: Add the new titles to Cloudflare
        run: npm run d1:push -- --append
      - name: Summary
        run: |
          {
            echo "### Dialogue index updated"
            npx wrangler d1 execute hearfinch-dialogue --remote --json --command \
              "SELECT media_type AS type, COUNT(*) AS titles FROM titles WHERE sources > 0 GROUP BY media_type" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s.slice(s.indexOf("[")))[0].results;for(const x of r)console.log(`- ${x.type === "tv" ? "Shows" : "Movies"}: ${x.titles}`)})'
          } >> "$GITHUB_STEP_SUMMARY"
