# Adds movies and shows to the dialogue index, from the OpenSubtitles.com API.
# Run it from Actions → Dialogue index → Run workflow. Safe to repeat: titles
# already in the index are skipped, and it stops cleanly at the daily download limit.
#
# It also runs by itself once a day, adding TV shows (one episode each, English-language
# shows only) until the index holds DAILY_SHOWS_TARGET shows. On the free OpenSubtitles
# plan that's roughly 20 new shows a day. To change the target, edit DAILY_SHOWS_TARGET;
# to stop the daily runs, use "Disable workflow" on the Actions page.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TMDB_API_KEY,
#   OPENSUBTITLES_API_KEY, OPENSUBTITLES_USERNAME, OPENSUBTITLES_PASSWORD
#
# Subtitle text is copyrighted. It only ever goes into your Cloudflare database —
# never into this repository or the workflow's artifacts.
name: Dialogue index

on:
  schedule:
    - cron: '17 9 * * *' # every day at 09:17 UTC
  workflow_dispatch:
    inputs:
      type:
        description: 'What to add'
        type: choice
        options: [movie, tv, both]
        default: movie
      list:
        description: 'Which TMDB list'
        type: choice
        options: [popular, top_rated, both]
        default: popular
      pages:
        description: 'Pages of 20 titles (per list)'
        default: '1'
      start_page:
        description: 'Start at page'
        default: '1'
      episodes:
        description: 'Episodes per show'
        default: '1'
      until:
        description: 'Stop once the index holds this many titles of that type (0 = no limit)'
        default: '0'

env:
  DAILY_SHOWS_TARGET: '1000'

concurrency:
  group: dialogue-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
      OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
      OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Clean up the Cloudflare secrets
        run: |
          # Strip spaces and line breaks that sneak in when copying from the dashboard.
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if [[ ! "$ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID doesn't look like an account ID (32 letters and numbers, from Workers & Pages → Account details). Re-paste the secret."
            exit 1
          fi
      - name: Find the dialogue database
        run: npm run ci:prepare-d1
      - name: Create or update its tables
        run: npx wrangler d1 migrations apply hearfinch-dialogue --remote
      - name: See what's already indexed
        run: npm run d1:pull
      - name: Download and index subtitles
        run: >
          npm run ci:index:opensubtitles --
          --type "${{ inputs.type || 'tv' }}"
          --list "${{ inputs.list || 'both' }}"
          --pages "${{ inputs.pages || '60' }}"
          --start-page "${{ inputs.start_page || '1' }}"
          --episodes "${{ inputs.episodes || '1' }}"
          --until "${{ inputs.until || env.DAILY_SHOWS_TARGET }}"
      - name: Add the new titles to Cloudflare
        run: npm run d1:push -- --append
      - name: Summary
        run: |
          {
            echo "### Dialogue index updated"
            npx wrangler d1 execute hearfinch-dialogue --remote --json --command \
              "SELECT media_type AS type, COUNT(*) AS titles FROM titles WHERE sources > 0 GROUP BY media_type" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s.slice(s.indexOf("[")))[0].results;for(const x of r)console.log(`- ${x.type === "tv" ? "Shows" : "Movies"}: ${x.titles}`)})'
          } >> "$GITHUB_STEP_SUMMARY"
