# Checks worker/ and deploys it to Cloudflare Workers.
#
# Setup lives entirely in GitHub (Settings → Secrets and variables → Actions → Secrets).
# Deploying starts once these two exist:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + Account › D1 › Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages → right-hand side)
# Each of these is optional; whatever is set gets copied to the Worker on every deploy:
#   TMDB_API_KEY, OPENAI_API_KEY, ACRCLOUD_ACCESS_KEY, ACRCLOUD_ACCESS_SECRET,
#   ANTHROPIC_API_KEY, ANTHROPIC_MODEL, TURNSTILE_SECRET
# The first deploy also creates the D1 dialogue database.
name: API

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['worker/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Waiting for Cloudflare setup
        if: env.READY != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the API. Skipping for now."
      - uses: actions/checkout@v5
        if: env.READY == 'true'
      - uses: actions/setup-node@v5
        if: env.READY == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: env.READY == 'true'
        run: npm ci
      - name: Find or create the dialogue database
        if: env.READY == 'true'
        run: npm run ci:prepare-d1
      - name: Create or update its tables
        if: env.READY == 'true'
        run: npx wrangler d1 migrations apply hearfinch-dialogue --remote
      - name: Deploy the Worker
        if: env.READY == 'true'
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Copy API keys to the Worker
        if: env.READY == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACRCLOUD_ACCESS_KEY: ${{ secrets.ACRCLOUD_ACCESS_KEY }}
          ACRCLOUD_ACCESS_SECRET: ${{ secrets.ACRCLOUD_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          node -e '
            const names = ["TMDB_API_KEY","OPENAI_API_KEY","ACRCLOUD_ACCESS_KEY","ACRCLOUD_ACCESS_SECRET","ANTHROPIC_API_KEY","ANTHROPIC_MODEL","TURNSTILE_SECRET"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n].trim()]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(set));
            console.log("Copying:", Object.keys(set).join(", ") || "(none yet)");
          '
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json
      - name: Show the API address
        if: env.READY == 'true'
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "API address: $URL"
          {
            echo "### Hearfinch API is deployed"
            echo ""
            echo "Address: **$URL**"
            echo ""
            echo "Next: add it as the repository variable \`API_URL\` (Settings → Secrets and variables → Actions → Variables), then run the Website workflow."
            echo ""
            echo "Check which steps are switched on: $URL/health"
          } >> "$GITHUB_STEP_SUMMARY"
